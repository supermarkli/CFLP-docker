data:
  dataset: "cifar10" # "mnist" or "cifar10"
  test_size: 0.2

model:
  name: "resnet18" # "cnn", "resnet18", "vgg16"

base:
  random_seed: 2

federation:
  # 隐私保护模式:
  # "none" - 标准联邦学习，明文传输。
  # "he"   - 使用同态加密保护模型参数。
  # "tee"  - 使用TDX（可信执行环境）在服务器端保护明文聚合。
  # "mpc"  - 使用MPC（秘密共享）在服务器端保护明文聚合。
  # "sgx"  - 使用SGX（可信执行环境）在服务器端保护明文聚合。
  privacy_mode: "tee" # <--- 总开关，可在此处切换实验模式
  expected_clients: 3
  max_rounds: 10000
  convergence:
    acc_delta_threshold: 0.01
    window: 3

grpc:
  server_host: "10.16.56.126"
  server_port: 50052
  max_retries: 5
  retry_interval: 1
  max_workers: 10

training:
  batch_size: 128
  learning_rate: 0.0005  # Adam 学习率
  momentum: 0.9          # SGD 时使用
  weight_decay: 0.0005   # L2 正则化
  epochs: 5

# 仅在 privacy_mode = "he" 时生效
encryption:
  # CKKS 同态加密参数 (TenSEAL)
  poly_modulus_degree: 8192 # 多项式模次数，必须是 2 的幂 (4096, 8192, 16384, 32768)
  coeff_mod_bit_sizes: [60, 40, 40, 60] # 系数模的位大小，影响安全性和精度
  global_scale: 1099511627776.0 # 全局缩放因子 (2^40)，用于浮点数精度
  # chunk_size: CKKS 每个密文打包的最大元素数
  # 限制: chunk_size <= poly_modulus_degree / 2
  # 例如: poly_modulus_degree=8192 时，chunk_size 最大为 4096
  chunk_size: 4096 # CKKS slots 数量，设置为 poly_modulus_degree / 2 以最大化 SIMD 效率

mpc:
  shamir_k: 3 # 恢复秘密需要的最小份额数
  shamir_n: 3 # 总共生成的份额数
  scaling_factor: 1000000 # 浮点数转整数的缩放因子
  chunk_size: 50000 # MPC参数分块处理的大小（影响内存和并行粒度）
  # 素数域选择：
  # - 大素数 (2^127-1): 安全性更高，但计算较慢（需要 Python 大整数运算）
  # - 小素数 (2^61-1):  计算快10-50倍（可用 NumPy int64），但溢出风险略高
  # 对于 3 个客户端、参数范围 [-1,1]、缩放因子 10^6，小素数完全足够
  prime_mod: "2305843009213693951" # 2^61 - 1 (快速版本，适合大多数场景)
  # prime_mod: "170141183460469231731687303715884105727" # 2^127 - 1 (高安全版本)

sgx:
  # 客户端用于验证聚合器Enclave身份的MRENCLAVE值。
  # 这个值是在 'gramine-sgx-sign' 过程中打印出来的，需要用真实值替换。
  expected_mrenclave: "11403bebc6ccf54d6da6cb62d24f5ea813677a10738e600bd4dcf82ac36263a0"

tee:
  # 客户端用于验证服务端TEE身份的“代码指纹”。
  expected_mrenclave: "08a4668e1b5055c8dea11d8631ffa5ae51db16dbf3741cc5c7c0d69f1b66708b"
