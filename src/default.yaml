data:
  dataset: "cifar10" # "mnist" or "cifar10"
  dirichlet_alpha: 0.5  # Dirichlet 分布参数，α 越小越 Non-IID
  local_val_size: 0.1  # 客户端本地验证集比例

model:
  name: "resnet18" # "cnn", "resnet18", "vgg16"

base:
  random_seed: 0  # 与 CFLP_Revision 一致

federation:
  # 隐私保护模式:
  # "none" - 标准联邦学习，明文传输。
  # "he"   - 使用同态加密保护模型参数。
  # "tee"  - 使用TDX（Trust Domain Extensions）在服务器端保护聚合，VM级别机密计算。
  # "mpc"  - 使用MPC（秘密共享）在服务器端保护明文聚合。
  # "sgx"  - 使用SGX（Software Guard Extensions）在Enclave内保护聚合，进程级别机密计算。
  privacy_mode: "tee" # <--- 总开关，可在此处切换实验模式
  expected_clients: 3
  max_rounds: 10000  # 与实验配置一致（100 轮）
  convergence:
    acc_delta_threshold: 0.005  # 与实验配置一致
    window: 4  # 与实验配置一致（检查最近4轮）

grpc:
  server_host: "10.16.56.126"
  server_port: 50052
  max_retries: 5
  retry_interval: 1
  max_workers: 10

training:
  batch_size: 128        # 训练批次大小
  eval_batch_size: 128   # 评估批次大小
  learning_rate: 0.01    # SGD 初始学习率
  momentum: 0.9          # SGD 动量系数
  weight_decay: 0.0005   # L2 正则化系数
  epochs: 5              # 每轮本地训练轮数（local_epochs）
  num_workers: 4         # DataLoader 多进程数
  prefetch_factor: 2     # 数据预取批次数
  use_amp: true          # 混合精度训练
  optimizer: sgd         # 优化器类型
  scheduler: cosine      # 学习率调度器
  estimated_rounds: 200  # 预估收敛轮数，用于学习率调度器
  gamma: 0.2             # MultiStepLR 衰减因子
  milestones:            # MultiStepLR 衰减节点
    - 60
    - 120
    - 160
  use_augmentation: true # 数据增强

# 仅在 privacy_mode = "he" 时生效
encryption:
  # CKKS 同态加密参数 (TenSEAL)
  poly_modulus_degree: 8192 # 多项式模次数，必须是 2 的幂 (4096, 8192, 16384, 32768)
  coeff_mod_bit_sizes: [60, 40, 40, 60] # 系数模的位大小，影响安全性和精度
  global_scale: 1099511627776.0 # 全局缩放因子 (2^40)，用于浮点数精度
  # chunk_size: CKKS 每个密文打包的最大元素数
  # 限制: chunk_size <= poly_modulus_degree / 2
  # 例如: poly_modulus_degree=8192 时，chunk_size 最大为 4096
  chunk_size: 4096 # CKKS slots 数量，设置为 poly_modulus_degree / 2 以最大化 SIMD 效率

mpc:
  shamir_k: 3 # 恢复秘密需要的最小份额数
  shamir_n: 3 # 总共生成的份额数
  scaling_factor: 1000000 # 浮点数转整数的缩放因子
  chunk_size: 50000 # MPC参数分块处理的大小（影响内存和并行粒度）
  # 素数域选择：
  # - 大素数 (2^127-1): 安全性更高，但计算较慢（需要 Python 大整数运算）
  # - 小素数 (2^61-1):  计算快10-50倍（可用 NumPy int64），但溢出风险略高
  # 对于 3 个客户端、参数范围 [-1,1]、缩放因子 10^6，小素数完全足够
  prime_mod: "2305843009213693951" # 2^61 - 1 (快速版本，适合大多数场景)
  # prime_mod: "170141183460469231731687303715884105727" # 2^127 - 1 (高安全版本)

sgx:
  # === Intel SGX (Software Guard Extensions) 配置 ===
  # SGX 是进程级别的机密计算技术，代码和数据在 Enclave 内受保护
  # 客户端用于验证聚合器 Enclave 身份的 MRENCLAVE 值
  # 这个值是在 'gramine-sgx-sign' 过程中打印出来的，需要用真实值替换
  expected_mrenclave: "11403bebc6ccf54d6da6cb62d24f5ea813677a10738e600bd4dcf82ac36263a0"

tee:
  # === Intel TDX (Trust Domain Extensions) 配置 ===
  # TDX 是 VM 级别的机密计算技术，整个 TD 虚拟机受硬件保护
  # 
  # 安全模型：
  # - 聚合器运行在 TDX Trust Domain (TD) 中
  # - 所有 TD 内存由 MKTME 硬件加密，主机/VMM 无法访问
  # - 客户端通过 TD Quote 验证聚合器身份
  # - 数据使用 RSA+AES 加密传输，只有 TD 内的私钥能解密
  
  # 是否允许在非 TDX 硬件上运行（开发/测试用）
  # 生产环境应设为 false
  allow_simulated: true
  
  # [传统配置，用于非 TDX 环境的回退验证]
  # 当无法生成真实 TD Quote 时，使用此值进行模拟验证
  expected_mrenclave: "08a4668e1b5055c8dea11d8631ffa5ae51db16dbf3741cc5c7c0d69f1b66708b"
  
  # [可选] 预期的 TD 测量值（用于严格验证）
  # 在生产环境中，客户端应验证 TD Quote 中的这些值
  # expected_mrtd: ""        # TD 的初始测量值
  # expected_rtmr0: ""       # 运行时测量寄存器 0
  # expected_rtmr1: ""       # 运行时测量寄存器 1
