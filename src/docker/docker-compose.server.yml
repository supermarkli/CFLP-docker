# Docker Compose configuration for federated learning server

services:
  server:
    container_name: fl-server
    build:
      context: ../..
      dockerfile: src/docker/Dockerfile.server
    ports:
      - "50052:50052"
      - "50051:50051"
    volumes:
      - ../../certs/server:/app/certs:ro
      - ../../logs:/app/logs
      - ../../out:/app/out
      - ../../data:/app/data
    networks:
      - federated-network

networks:
  federated-network:
    driver: bridge 